name: Update rules (weekly)

# Runs on GitHub's servers, Mondays 03:00 Asia/Shanghai.
# Private-repo Actions free quota is 2,000 minutes/month (GitHub Free);
# this job takes ~3 minutes per run, once a week (~12 minutes/month).

on:
  schedule:
    # Mondays 03:00 Asia/Shanghai = Sundays 19:00 UTC
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate rule lists (Meta from RIPEstat, LinuxDO from crt.sh)
        run: python3 scripts/update_rules.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- Meta.list LinuxDO.list; then
            echo "No rule changes this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Meta.list LinuxDO.list
          git commit -m "chore: weekly rules update ($(date -u +%F))"
          git push
